name: Deploy hermes-sauce (agent image)

on:
  push:
    branches: [sauce]
    paths:
      - "gateway/**"
      - "tools/**"
      - "toolsets.py"
      - "run_agent.py"
      - "Dockerfile"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-sauce-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sauce branch
        uses: actions/checkout@v4
        with:
          ref: sauce

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (cache from last)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/solesurvivor1981-max/hermes-sauce:${{ github.sha }}
            ghcr.io/solesurvivor1981-max/hermes-sauce:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy (de-agents)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SAUCE_AGENTS_HOST }}
          username: root
          key: ${{ secrets.SAUCE_AGENTS_SSH_KEY }}
          port: 22022
          script_stop: true
          script: /usr/local/bin/sauce-deploy-agent.sh ${{ github.sha }}

      - name: Checkout for notify
        uses: actions/checkout@v4

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_NOTIFY_TOKEN }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPO: hermes-sauce (agent)
        run: python3 .github/workflows/notify.py